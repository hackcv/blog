# hackcv.com 主站（2026-08-28 加固：www 301 + HSTS/CSP + 保留微信草稿代理）
# 备份：/etc/nginx/sites-enabled/hackcv.conf.bak-20260828

# --- www 裸域：HTTP 一律 301 到主域 ---
server {
    listen 80;
    server_name www.hackcv.com;

    # acme.sh HTTP-01 验证路径放行
    location /.well-known/acme-challenge/ {
        root /home/ubuntu/hackcv/public;
    }

    location / {
        return 301 https://hackcv.com$request_uri;
    }
}

# --- www 443：证书含 www（SAN），301 到主域 ---
server {
    listen 443 ssl;
    server_name www.hackcv.com;
    ssl_certificate /etc/nginx/ssl/hackcv.com.pem;
    ssl_certificate_key /etc/nginx/ssl/hackcv.com.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:HIGH:!aNULL:!MD5:!RC4:!DHE;
    add_header Strict-Transport-Security "max-age=31536000" always;
    return 301 https://hackcv.com$request_uri;
}

server {
    listen 80;
    server_name hackcv.com;
    access_log /var/log/nginx/hackcv.access.log;

    # acme.sh HTTP-01 验证路径放行
    location /.well-known/acme-challenge/ {
        root /home/ubuntu/hackcv/public;
    }

    # 强制 HTTP 跳转到 HTTPS（推荐）
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name hackcv.com;
    access_log /var/log/nginx/hackcv.access.log;

    # SSL 证书路径
    ssl_certificate /etc/nginx/ssl/hackcv.com.pem;
    ssl_certificate_key /etc/nginx/ssl/hackcv.com.key;

    # SSL 安全优化（固定写法）
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:HIGH:!aNULL:!MD5:!RC4:!DHE;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # 安全响应头（server 级；json/图片 location 单独补，nginx 不继承）
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://cloud.umami.is https://www.googletagmanager.com https://www.google-analytics.com https://giscus.app; style-src 'self' 'unsafe-inline' https://giscus.app; img-src 'self' data: https:; font-src 'self'; connect-src 'self' https://cloud.umami.is https://gateway.umami.is https://www.google-analytics.com https://analytics.google.com https://giscus.app; frame-src 'self' https://giscus.app; object-src 'none'; base-uri 'self'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # 草稿图文可能较大，调高请求体上限
    client_max_body_size 20m;

    # 微信草稿代理入口 /api/wx_draft -> 本机 Go 服务(127.0.0.1:3000)
    location /api/wx_draft/ {
        proxy_pass http://127.0.0.1:3000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }

    root /home/ubuntu/hackcv/public;
    index index.html;

    # Gzip 压缩（JSON 必须）
    gzip on;
    gzip_types application/json text/plain;
    gzip_min_length 1000;

    # giscus 自定义主题 CSS：需跨域提供给 giscus.app 的 iframe
    # giscus 用 <link rel="stylesheet" crossorigin="anonymous"> 加载，必须带 ACAO 否则样式被浏览器丢弃
    location = /css/giscus.css {
        add_header Access-Control-Allow-Origin "https://giscus.app" always;
        add_header Vary "Origin" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://cloud.umami.is https://www.googletagmanager.com https://www.google-analytics.com https://giscus.app; style-src 'self' 'unsafe-inline' https://giscus.app; img-src 'self' data: https:; font-src 'self'; connect-src 'self' https://cloud.umami.is https://gateway.umami.is https://www.google-analytics.com https://analytics.google.com https://giscus.app; frame-src 'self' https://giscus.app; object-src 'none'; base-uri 'self'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        expires 1h;

        # 预检请求直接放行
        if ($request_method = OPTIONS) {
            return 204;
        }
    }

    # JSON 文件缓存
    location ~* \.json$ {
        add_header Cache-Control "public, max-age=3600";
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://cloud.umami.is https://www.googletagmanager.com https://www.google-analytics.com https://giscus.app; style-src 'self' 'unsafe-inline' https://giscus.app; img-src 'self' data: https:; font-src 'self'; connect-src 'self' https://cloud.umami.is https://gateway.umami.is https://www.google-analytics.com https://analytics.google.com https://giscus.app; frame-src 'self' https://giscus.app; object-src 'none'; base-uri 'self'" always;
        expires 1h;
    }

    # HTML 文件
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 图片缓存
    location ~* \.(jpg|jpeg|png|gif|ico|svg|webp|woff2)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://cloud.umami.is https://www.googletagmanager.com https://www.google-analytics.com https://giscus.app; style-src 'self' 'unsafe-inline' https://giscus.app; img-src 'self' data: https:; font-src 'self'; connect-src 'self' https://cloud.umami.is https://gateway.umami.is https://www.google-analytics.com https://analytics.google.com https://giscus.app; frame-src 'self' https://giscus.app; object-src 'none'; base-uri 'self'" always;
    }
}
