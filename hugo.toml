baseURL = 'https://www.hackcv.com/'
languageCode = 'zh-cn'
title = 'HackCV 博客'
theme = 'PaperMod'

enableRobotsTXT = true
enableEmoji = true

defaultContentLanguage = 'zh-cn'

[params]
  env = 'production'
  title = 'HackCV 博客'
  description = 'HackCV 个人博客 - 记录技术、生活与思考'
  author = 'HackCV'
  DateFormat = '2006-01-02'
  defaultTheme = 'auto'
  disableThemeToggle = false
  ShowReadingTime = true
  ShowShareButtons = true
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = true
  ShowWordCount = true
  comments = true                # PaperMod 评论开关（配合 layouts/partials/comments.html）

  fuseOpts = { isCaseSensitive = false, shouldSort = true, location = 0, distance = 1000, threshold = 0.4, minMatchCharLength = 0, keys = ['title', 'permalink', 'summary', 'content'] }

# 菜单（搜索页入口）
[[menu.main]]
  identifier = 'search'
  name = '搜索'
  url = '/search/'
  weight = 10

[[menu.main]]
  identifier = 'archives'
  name = '归档'
  url = '/archives/'
  weight = 20

[[menu.main]]
  identifier = 'tags'
  name = '标签'
  url = '/tags/'
  weight = 30

# 主页输出 JSON：供 PaperMod 内置 fuse.js 搜索索引
[outputs]
  home = ['HTML', 'RSS', 'JSON']
