baseURL = 'https://hackcv.com/'
locale = 'zh-CN'
title = 'hackcv'
theme = 'hackcv'

defaultContentLanguage = 'zh-cn'
defaultContentLanguageInSubdir = false

[languages]
  [languages.zh-cn]
    locale = 'zh-CN'
    label = '简体中文'
    weight = 1
  [languages.en]
    locale = 'en-US'
    label = 'English'
    weight = 2
    [languages.en.params]
    description = "AI news aggregation & digest site"
    tagline = "Research briefs, deep reads and hands-on practice"

[params]
description = "AI 资讯聚合与摘要站点"
coverService = "picsum"
github = "https://github.com/hackcv"
email = "hello@hackcv.com"
twitter = "hackcv"
comments = true

[params.analytics]
umamiWebsiteId = "cb8c433a-10c8-4ecc-a259-fd8c6c974b92"
umamiSource = "https://cloud.umami.is/script.js"
ga4MeasurementId = "G-473TJH28NM"

[sitemap]
changefreq = "weekly"
filename = "sitemap.xml"
priority = 0.5

[outputs]
home = ["HTML", "RSS", "JSON"]
section = ["HTML", "RSS", "JSON"]
page = ["HTML", "JSON"]
taxonomy = ["HTML"]
term = ["HTML", "JSON"]



[services.rss]
limit = 20

[taxonomies]
tag = "tags"
category = "categories"

[build]
writeStats = true

[markup.goldmark.renderer]
hardWraps = true
