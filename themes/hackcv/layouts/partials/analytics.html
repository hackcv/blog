{{- /* 访问统计：Umami + Google Analytics 4 并存 */ -}}
<script defer src="{{ .Site.Params.analytics.umamiSource }}" data-website-id="{{ .Site.Params.analytics.umamiWebsiteId }}"></script>
{{- with .Site.Params.analytics.ga4MeasurementId }}
<script async src="https://www.googletagmanager.com/gtag/js?id={{ . }}"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());
  gtag('config', '{{ . }}');
</script>
{{- end }}
