<header class="site-header">
  <div class="container header-inner">
    <a href="{{ .Site.BaseURL }}" class="site-logo">
      <img src="{{ "images/logo-mark.png" | relURL }}" alt="" class="site-logo-img" width="82" height="53">
      <span>hack<span>cv</span></span>
    </a>
    <nav class="nav" aria-label="主导航">
      {{- $current := .RelPermalink }}
      <a href="{{ .Site.BaseURL }}"{{ if eq $current "/" }} aria-current="page"{{ end }}>首页</a>
      <a href="{{ .Site.BaseURL }}news/"{{ if eq $current "/news/" }} aria-current="page"{{ end }}>资讯</a>
      <a href="{{ .Site.BaseURL }}deep/"{{ if eq $current "/deep/" }} aria-current="page"{{ end }}>精读</a>
      <a href="{{ .Site.BaseURL }}practice/"{{ if eq $current "/practice/" }} aria-current="page"{{ end }}>实践</a>
      <a href="{{ .Site.BaseURL }}about/"{{ if eq $current "/about/" }} aria-current="page"{{ end }}>关于</a>
    </nav>
    <div class="header-tools">
      <a href="{{ .Site.BaseURL }}search/" class="header-search" aria-label="搜索"{{ if eq $current "/search/" }} aria-current="page"{{ end }}>
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="7" cy="7" r="5"/><path d="M10.8 10.8 14.5 14.5"/></svg>
      </a>
    </div>
  </div>
</header>
